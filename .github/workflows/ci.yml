name: CI

# The compatibility covenant is enforced here: every push and PR must keep
# the whole test suite green on every supported platform.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 has no build for Ubuntu 26.04 (current ubuntu-latest),
        # so the 3.8 leg pins the older runner.
        include:
          - { os: ubuntu-22.04, python-version: "3.8" }
          - { os: macos-latest, python-version: "3.8" }
          - { os: windows-latest, python-version: "3.8" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  package:
    # Prove the installed package works, not just the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install as a package
        run: pip install .
      - name: Smoke-test the console script
        run: burl examples/fib.burl && burl --version
