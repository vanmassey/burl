name: CI

# The compatibility covenant is enforced here: every push and PR must keep
# the whole test suite green on every supported platform.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 has no build for Ubuntu 26.04 (current ubuntu-latest),
        # so the 3.8 leg pins the older runner.
        include:
          - { os: ubuntu-22.04, python-version: "3.8" }
          - { os: macos-latest, python-version: "3.8" }
          - { os: windows-latest, python-version: "3.8" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: The checker passes on every example (ROADMAP v0.3)
        run: python -m burl check examples/fizzbuzz.burl examples/fib.burl examples/wordcount.burl examples/adventure.burl examples/riddle.burl examples/lib/saga.burl benchmarks/fibrec.burl benchmarks/primes.burl benchmarks/sort.burl benchmarks/strings.burl
      - name: The checker passes on the engine itself (ROADMAP v0.4)
        run: python -m burl check src/lex.burl src/parse.burl src/interp.burl src/kernel.burl src/burl.burl
      - name: Benchmark programs reproduce their expected output (benchmarks/README.md)
        run: python benchmarks/run.py --check

  package:
    # Prove the installed package works, not just the checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install as a package
        run: pip install .
      - name: Smoke-test the console script
        run: burl examples/fib.burl && burl --version
      - name: Smoke-test the checker
        run: burl check examples/fib.burl
